# Run jev-bridge in front of an OpenAI-compatible LLM server.
#
#   export OPENAI_API_KEY=sk-...
#   docker compose up
#   curl http://127.0.0.1:8900/health
#
# This file is the repo default: the official OpenAI API. Any other
# OpenAI-compatible server (llama.cpp, vLLM, SGLang, LMDeploy, TGI, ...) is a
# matter of pointing JEVB_BACKEND_BASE_URL + JEVB_BACKEND_MODEL at it — see the
# three worked examples in the README's Docker section.
services:
  jev-bridge:
    build: .
    image: jev-bridge:latest
    # once you have a published image, drop build: and use it instead:
    # image: ghcr.io/<yourname>/jev-bridge:latest
    environment:
      JEVB_BACKEND_BASE_URL: https://api.openai.com/v1
      # must be a logprobs-capable model
      JEVB_BACKEND_MODEL: gpt-4o-mini
      # taken from the host env; a self-hosted server usually accepts any
      # non-empty token here
      JEVB_BACKEND_API_KEY: ${OPENAI_API_KEY:-}
      JEVB_MAX_CONCURRENCY: "8"
      # OpenAI understands neither chat_template_kwargs nor assistant prefill:
      JEVB_DISABLE_THINKING: "0"
      JEVB_PREFILL_ASSISTANT: "0"
      # OpenAI caps top_logprobs at 20 — this is both the default and the max:
      # JEVB_TOP_K: "20"
    ports:
      - "127.0.0.1:8900:8900"
    # Only needed when the backend runs on the host and is reached as
    # host.docker.internal (llama.cpp / vLLM examples in the README):
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
